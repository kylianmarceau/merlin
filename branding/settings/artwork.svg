<!-- Original Merlin Settings artwork. Groups are rendered individually, for example:
     rsvg-convert -i general -z 2 artwork.svg -o general.png -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="420" height="152" viewBox="0 0 420 152">
