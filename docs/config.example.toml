# modal_browser configuration
#
# Copy to ~/.config/modal_browser/config.toml (or
# $XDG_CONFIG_HOME/modal_browser/config.toml) and run :config-reload, or
# open a new window. Every option is optional; anything you leave out keeps
# its default. Errors are shown in the status pill with their line number,
# and everything valid still applies.
#
# The format is TOML. Supported: tables, strings, integers, booleans and
# arrays. Not supported yet (rejected with a clear error): floats, dates,
# inline tables, multi-line strings.

[options]
# Modes, link hints and key bindings. With false, every key goes to the page
# as in any other browser; Merlin's pages, toolbar and browserctl keep
# working. The switch in Settings > Keys sets this.
modal_browsing = true
# Pixels per j/k/h/l step.
scroll_step = 60
# Animate page-sized jumps (gg, G, Ctrl-d, Ctrl-f). Line steps are always
# instant.
smooth_scroll = true
# How long a prefix like `g` waits for the next key, in milliseconds.
sequence_timeout_ms = 1000
# Characters used for link-hint labels, easiest first.
hint_chars = "sadfjklewcmpgh"
# Enter Insert mode when a text field gets focus.
auto_insert = true
# Tabs in a sidebar (Chromium's vertical tab strip) by default. Only the
# default: a layout you pick in the tab strip's menu or with :vertical-tabs
# is remembered and wins over this.
vertical_tabs = true
# Start with the tabs hidden, the page filling the window. Cmd-S (or
# :hide-tabs) shows or hides them in the current window.
hide_tabs = false
# How frosted pop-ups, menus, the command menu and the start page's
# suggestions are: "low", "medium" or "high" lets that much of what is
# behind show through; "solid" keeps one flat colour. Settings >
# Appearance > Pop-up transparency writes this.
popup_transparency = "medium"
# The key that leaves Passthrough mode (plain <Esc> goes to the site).
passthrough_exit = "<S-Esc>"
# Sites with their own keyboard shortcuts: Passthrough starts automatically
# there. "*.example.com" also matches example.com.
passthrough_sites = [
  # "mail.google.com",
  # "docs.google.com",
  # "*.figma.com",
]
# Reopen last session's windows and tabs at launch (also after a crash).
# Only the default: a choice in Settings > On startup wins.
restore_session = true
# A window opened from (or saved as) a workspace keeps that workspace's
# file up to date as its tabs change, a few seconds after each change.
workspace_autosave = true
# Accept commands from `browserctl` over a Unix socket only this user can
# reach. Private windows are never visible to it.
browserctl = true
# The program :edit (and ge, :extract ... editor) runs, as a list: no shell
# is involved. "{file}" is replaced by the temporary file's path. Without
# this, $VISUAL then $EDITOR is used, which only works for editors that open
# their own window. Terminal Neovim needs a terminal to run in. With
# Ghostty, give the full path (apps started from the browser do not see your
# shell's PATH) and let that Ghostty instance quit when Neovim does, so the
# browser knows the edit is over and removes its temporary file:
# editor = ["/Applications/Ghostty.app/Contents/MacOS/ghostty", "--quit-after-last-window-closed=true", "-e", "nvim", "{file}"]
# editor = ["neovide", "--no-fork", "{file}"]
# editor = ["kitty", "nvim", "{file}"]
# While typing in a field, this key opens it in the editor (it must use
# Control or Command, so it never takes a key you type).
edit_key = "<C-S-e>"

# Bindings: "keys" = "command line". Keys use Vim notation: <C-x> is
# Control, <D-x> is Command, <A-x> is Option, <S-x> is Shift. Run :help to
# search every command and its current keys.
[keys.normal]
# "<C-n>" = "tabnext"
# "<C-p>" = "tabprevious"
# x = "tabclose"
# X = "tabrestore"
# ",y" = "yank markdown"
# ",g" = "open https://github.com"
# ",w" = "workspace save"
# ",v" = "vsplit"

# Your own commands: name = "command line". Extra words you type after the
# name are appended. They show up in completion and under ?, and can be
# bound in [keys.normal] like any command.
[aliases]
# issues = "open github.com/issues"
# rs = "open docs.rs"
# notes = "workspace open notes"

# Visual mode (after v): motions extend the selection, y copies it.
[keys.visual]
# Y = "yank selection"

# Keys to give back to sites (they reach the page again).
[unmap]
# normal = ["d", "u"]
# Native ad blocking is independent of modal_browsing. Its global toggle,
# selected lists, automatic updates and exact-host exceptions are stored in
# each Chromium profile, in Settings > Ad blocking. Commands:
# :adblock on | off | site toggle | status | update
# Reload open pages after changing protection to remove/apply page hooks.
