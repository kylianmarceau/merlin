# Daily: is the pinned Chromium behind Mac Stable? Stable releases carry the
# security fixes, so when a rebase is due this opens one issue for it
# (docs/UPSTREAM.md, "Rebase procedure"; docs/RELEASE.md, security-only
# release). An unconfirmed result (pin ahead of Stable, commit mismatch, or a
# failed check) fails the job so it is noticed.
name: upstream

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  chromium-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compare UPSTREAM_PIN with Mac Stable
        id: upstream
        run: |
          set +e
          scripts/check_upstream.py --json > result.json
          code=$?
          set -e
          cat result.json
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 current, 1 behind (rebase due), 2 unconfirmed or failed.
          [ "$code" -le 1 ]

      - name: Open an issue when a rebase is due
        if: steps.upstream.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pinned=$(python3 -c 'import json; print(json.load(open("result.json"))["pinned"])')
          stable=$(python3 -c 'import json; print(json.load(open("result.json"))["stable"])')
          commit=$(python3 -c 'import json; print(json.load(open("result.json"))["stable_commit"])')
          title="Rebase due: Chromium $stable (pinned $pinned)"
          if gh issue list --state open --search "\"Rebase due: Chromium $stable\" in:title" \
               --json number --jq '.[].number' | grep -q .; then
            echo "An open issue already covers $stable."
            exit 0
          fi
          gh issue create --title "$title" --body "$(cat <<EOF
          Mac Stable is **$stable** (\`$commit\`); \`UPSTREAM_PIN\` is **$pinned**.

          Stable releases carry Chromium's security fixes. Follow the rebase
          procedure in \`docs/UPSTREAM.md\`, then cut a security-only release
          (\`docs/RELEASE.md\`).

          Opened by the daily \`upstream\` workflow.
          EOF
          )"
